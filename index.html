<!doctype html>
<html lang="en">
  <head>
    <script>
      // Defensive fix for environments where window.fetch only has a getter
      (function() {
        try {
          var origFetch = window.fetch || window.webkitFetch || window.mozFetch;
          if (origFetch) {
            var currentFetch = origFetch;
            var descriptor = {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            };
            
            // Try defining on window directly
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e1) {
              console.warn("Failed to define fetch on window, trying prototype:", e1);
            }
            
            // Try defining on Window.prototype as well
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', descriptor);
              }
            } catch (e2) {
              console.warn("Failed to define fetch on Window.prototype:", e2);
            }
          }
        } catch (e) {
          console.warn("Defensive fetch redefinition failed completely:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>СНО ФЭМ БГЭУ | Студенческое научное общество</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
