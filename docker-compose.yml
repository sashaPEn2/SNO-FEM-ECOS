version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: sno-fem-ecos-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - sno-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sno-fem-ecos-backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://root:password@mongodb:27017/sno-fem-ecos?authSource=admin
      JWT_SECRET: your_jwt_secret_key
      JWT_EXPIRE: 7d
      NODE_ENV: development
    depends_on:
      - mongodb
    networks:
      - sno-network
    volumes:
      - ./server:/app
    command: npm run dev

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sno-fem-ecos-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - sno-network
    volumes:
      - ./client:/app

volumes:
  mongodb_data:

networks:
  sno-network:
    driver: bridge
